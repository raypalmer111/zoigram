<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoigram · Profile photo</title><link rel="stylesheet" href="/avatar/app.css"></head>
<body><main><a class="brand" href="/">Zoigram</a><p class="eyebrow" data-i18n="eyebrow">YOUR PROFILE</p><h1 data-i18n="title">Make it yours.</h1><p class="intro" data-i18n="intro">Choose a photo for your Zoigram profile. It appears next to your posts, comments and messages.</p>
<form id="form"><div class="preview"><img id="preview" alt="" hidden><span id="placeholder">Z</span></div>
<label class="choose"><span data-i18n="choose">Choose a photo</span><input id="file" type="file" accept="image/png,image/jpeg,image/webp" required></label>
<p class="hint" data-i18n="hint">PNG, JPG or WebP · up to 8 MB. Your photo is cropped to a circle from the centre.</p>
<button id="save" type="submit" disabled data-i18n="save">Save profile photo</button><p id="status" role="status" aria-live="polite"></p></form>
<p class="footer" data-i18n="footer">Opened from your game profile. This link can only change your avatar.</p></main><script src="/avatar/app.js"></script></body></html>
