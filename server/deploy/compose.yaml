name: zoigram
services:
  api:
    image: zoigram-api:local
    build: ..
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      COMMUNITY_NAME: ${COMMUNITY_NAME:-Zoigram}
      STORAGE_LIMIT_MB: ${STORAGE_LIMIT_MB:-2048}
      TRUST_PROXY: loopback
      OWNER_STEAM_ID: ${OWNER_STEAM_ID:-}
      OWNER_PROFILE_ID: ${OWNER_PROFILE_ID:-}
    volumes:
      - community:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:43821/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  backup:
    image: zoigram-api:local
    pull_policy: never
    command: [node, tools/backup.cjs, worker]
    restart: 'on-failure:3'
    init: true
    network_mode: none
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - community:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      api:
        condition: service_healthy
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      api:
        condition: service_healthy
volumes:
  community:
  backups:
  caddy_data:
  caddy_config:

